<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch / home indicator; the UI pads itself with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05080d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="RECURSION: a temporal puzzle adventure. Record a run, rewind, and play alongside the echoes of your past self." />
    <!-- Home-screen web app (iOS Safari "Add to Home Screen", Android install): full screen, landscape. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RECURSION" />
    <meta name="format-detection" content="telephone=no" />
    <title>RECURSION</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; background: #05080d; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
    </style>
    <!-- Hallucinated Games studio ident. Vendored from gameCentral/intro/hallucinated-intro.js
         (same copy as AlienDigger) so this game stays a self-contained deploy; re-copy to update.
         Plain script, not a module: it defines window.HallucinatedIntro. Lives in public/ so Vite
         copies it verbatim. -->
    <script src="./intro/hallucinated-intro.js"></script>
  </head>
  <body>
    <!-- Started from a classic script at the top of <body> so the ident covers the page before
         the deferred module boots. main.ts awaits window.__studioIntro before bootstrapping, so
         the key or tap that skips the ident can't also activate the main menu. -->
    <script>
      window.__studioIntro = (function () {
        try {
          var q = new URLSearchParams(location.search);
          // Automated browsers (Playwright sets navigator.webdriver) and ?nointro/?dev skip it,
          // otherwise the overlay would swallow the tests' first clicks.
          if (q.has('nointro') || q.has('dev') || navigator.webdriver || !window.HallucinatedIntro) {
            return Promise.resolve();
          }
          // No sound: a cold load has no user gesture yet, so the sting would be dropped.
          var intro = window.HallucinatedIntro.play({ skippable: true, sound: false }).catch(function () {});
          // The ident skips on a key or tap; a controller button press skips it too (the Gamepad API has no
          // events for buttons, so poll and forward the press as a key). The game ignores a button still held
          // when it boots, so this press cannot also activate the main menu.
          if (navigator.getGamepads) {
            var introDone = false;
            intro.then(function () { introDone = true; });
            var pollPads = function () {
              if (introDone) return;
              try {
                var pads = navigator.getGamepads() || [];
                for (var i = 0; i < pads.length; i++) {
                  var p = pads[i];
                  if (!p || !p.buttons) continue;
                  for (var b = 0; b < p.buttons.length; b++) {
                    if (p.buttons[b] && p.buttons[b].pressed) {
                      introDone = true;
                      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter' }));
                      return;
                    }
                  }
                }
              } catch (e) { return; }
              requestAnimationFrame(pollPads);
            };
            requestAnimationFrame(pollPads);
          }
          return intro;
        } catch (e) { return Promise.resolve(); }
      })();
    </script>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
