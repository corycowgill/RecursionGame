<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080d" />
    <title>RECURSION · UI Preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden;
        background: radial-gradient(120% 90% at 60% 40%, #0d2236 0%, #081422 38%, #04080f 75%); }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/ui/preview/preview.ts"></script>
  </body>
</html>
