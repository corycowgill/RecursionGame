# Render Blueprint: deploys RECURSION as a static site.
# Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: recursion
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Hashed build assets never change; cache them for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
