# Render Blueprint: deploys RECURSION as a static site.
# Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: recursion
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Hashed build assets never change; cache them for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The app shell must always be revalidated so a new deploy is picked up (the service worker is network-first
      # for it too). "/" is listed as well because the root URL serves index.html.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Service worker: never let the HTTP cache serve a stale copy, so browsers see each new precache manifest.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
