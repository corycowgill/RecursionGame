<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- RECURSION app icon: the ring motif (cyan graduated outer ring, gold arc segments, cyan dashed inner ring,
       glowing core) on deep navy. Full-bleed square: iOS / Android apply their own corner mask. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#10233f"/><stop offset=".55" stop-color="#081325"/><stop offset="1" stop-color="#03070e"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bff3ff" stop-opacity=".95"/><stop offset=".22" stop-color="#5fe0ff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#3fd9ff" stop-opacity=".12"/><stop offset="1" stop-color="#3fd9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe2a8"/><stop offset="1" stop-color="#d48a2c"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#76c4ff" stroke-opacity=".08" stroke-width="1.5">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="url(#core)"/>
  <g fill="none" transform="translate(256 256)">
    <circle r="196" stroke="#76c4ff" stroke-opacity=".22" stroke-width="2"/>
    <circle r="184" stroke="#8fd8ff" stroke-opacity=".6" stroke-width="10" stroke-dasharray="2.2 17.07"/>
    <g filter="url(#glow)">
      <circle r="150" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" stroke-dasharray="190 46 96 46 280 46 120 118" transform="rotate(-80)"/>
      <circle r="104" stroke="#3fd9ff" stroke-width="8" stroke-dasharray="7 13" stroke-opacity=".9"/>
      <circle r="58" stroke="#ffd894" stroke-width="16"/>
    </g>
    <circle r="24" fill="#fff3d6"/>
    <g fill="#ffd894" stroke="#ffb54a" stroke-width="2">
      <circle cx="150" cy="0" r="9"/><circle cx="-75" cy="129.9" r="9"/><circle cx="-75" cy="-129.9" r="9"/>
    </g>
  </g>
</svg>
